# Lokalne środowisko backendu prywatnej karty pacjenta.
#
# Uruchomienie całości (baza + backend) jedną komendą:
#   1. copy .env.example .env  i zmień POSTGRES_PASSWORD / JWT_SECRET
#   2. docker compose up -d --build
#   3. http://localhost:8080/actuator/health  ->  {"status":"UP"}
#
# PostgreSQL i backend są wystawione wyłącznie lokalnie. Nie publikuj ich
# w sieci publicznej ani nie używaj tego zestawu z prawdziwymi danymi medycznymi.
services:
  postgres:
    image: postgres:16-alpine
    container_name: patientcard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patientcard}
      POSTGRES_USER: ${POSTGRES_USER:-patientcard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - patientcard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patientcard} -d ${POSTGRES_DB:-patientcard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: patientcard-backend:local
    container_name: patientcard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-patientcard}
      DB_USERNAME: ${POSTGRES_USER:-patientcard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      STORAGE_ROOT: /data/storage
      AI_PROVIDER: mock
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-26214400}
    ports:
      # Backend musi być osiągalny z telefonu/emulatora w prywatnej sieci Wi-Fi.
      - "8080:8080"
    volumes:
      - patientcard_storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  patientcard_pgdata:
  patientcard_storage:
